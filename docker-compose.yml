services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: cloudcanvas
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cloudcanvas"]
      interval: 5s
      timeout: 5s
      retries: 10

  service:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
    env_file:
      - ./service/.env
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      CLOUDCANVAS_SERVER_URL: http://server:9000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5

  server:
    build:
      context: .
      dockerfile: docker/Dockerfile.server
    env_file:
      - ./server/.env
    environment:
      NODE_ENV: production
      PORT: 9000
      DATABASE_URL: postgresql://postgres:dev@postgres:5432/cloudcanvas
      MICROSERVICE_BASE_URL: http://service:8000
    ports:
      - "9000:9000"
    depends_on:
      postgres:
        condition: service_healthy
      service:
        condition: service_healthy
    command: ["sh", "-c", "npx prisma migrate deploy && npm run start"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:9000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5

  client:
    build:
      context: .
      dockerfile: docker/Dockerfile.client
      secrets:
        - client_env
    env_file:
      - ./client/.env
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      HTTP_SERVER_BASE_URL: http://server:9000
      NEXTAUTH_URL: http://localhost:3000
    ports:
      - "3000:3000"
    depends_on:
      server:
        condition: service_healthy

secrets:
  client_env:
    file: ./client/.env

volumes:
  postgres_data:
